$kind: http-request
description: "Scénario vidéo 7 : Modification partielle valide (PATCH). Seul le champ spécifié est mis à jour et updatedAt est actualisé."
url: "{{baseUrl}}/places/{{placeId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "description": "Espace rénové avec isolation phonique et prises USB-C."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.expect(json.description).to.eql("Espace rénové avec isolation phonique et prises USB-C.");
    language: text/javascript
order: 7000
