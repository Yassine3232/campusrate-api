$kind: http-request
description: "Option M2 : Vérifie que l'agrégation MongoDB a recalculé averageRating = 5.0 et reviewCount = 1."
url: "{{baseUrl}}/places/{{placeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("averageRating and reviewCount updated", function () {
          pm.expect(json.averageRating).to.eql(5);
          pm.expect(json.reviewCount).to.eql(1);
      });
    language: text/javascript
order: 11000
