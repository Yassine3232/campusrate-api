$kind: http-request
name: 08 - Tentative de modifier un champ contrôlé par le serveur (400 Bad Request)
description: "Scénario vidéo 8 : Tentative frauduleuse de falsifier la note moyenne 'averageRating' dans un PATCH. Rejeté immédiatement avec 400 Bad Request car absent du DTO et protégé par forbidNonWhitelisted."
url: "{{baseUrl}}/places/{{placeId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "averageRating": 5.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      var json = pm.response.json();
      pm.expect(json.status).to.eql(400);
      pm.expect(json.detail).to.include("averageRating");
    language: text/javascript
order: 8000
